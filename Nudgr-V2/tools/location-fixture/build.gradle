apply plugin: 'com.android.application'

android {
    namespace 'com.nudgr.qalocation'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nudgr.qalocation'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    signingConfigs.debug {
        storeFile new File(rootProject.projectDir, 'app/debug.keystore')
        storePassword 'android'
        keyAlias 'androiddebugkey'
        keyPassword 'android'
    }
}
dependencies { implementation 'com.google.android.gms:play-services-location:21.3.0' }
